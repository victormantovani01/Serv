       body {

/* Barra lateral */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 80px;
    background-color: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
    z-index: 1000; /* Garante que fique sobre o conteúdo */
}

.sidebar a {
    text-decoration: none;
    color: white;
    text-align: center;
    padding: 20px 0;
    width: 100%;
    transition: background 0.3s;
}

.sidebar a:hover {
    background-color: #333;
}

.sidebar span {
    font-size: 12px;
}

.submenu {
    display: none;
    flex-direction: column;
    background-color: #111;
    width: 100%;
}

.sidebar a:hover + .submenu, .submenu:hover {
    display: flex;
}

.submenu a {
    padding: 10px 0;
    font-size: 10px;
    color: white;
}

.main-content {
    margin-left: 80px;
    padding: 20px;
}

/* Responsividade */
@media (max-width: 768px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        flex-direction: row;
        justify-content: space-around;
        padding: 10px 0;
    }

    .main-content {
        margin-left: 0;
        margin-top: 10px;
        padding: 10px;
    }

    .suplementos-imagens {
        flex-direction: column;
        align-items: center;
    }

    .suplementos-precos {
        flex-direction: column;
        align-items: center;
    }

    .sidebar a {
        padding: 10px;
    }

    .sidebar span {
        display: none;
    }

    .submenu {
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
    }
}

.header {
    text-align: center;

}

hr {

}

    flex-wrap: wrap;
    gap: 10px;

}

.suplementos-precos span {
    font-size: 16px;
    font-weight: bold;
